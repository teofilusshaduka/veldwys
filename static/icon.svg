<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#F5F5F0"/>
  <g transform="translate(256,256)" fill="none" stroke="#2D2D2D" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter">
    <!-- V shape -->
    <path d="M-110,-80 L0,100 L110,-80"/>
    <!-- W crossbar -->
    <line x1="-120" y1="-20" x2="120" y2="-20"/>
    <!-- Compass circle -->
    <circle cx="0" cy="-20" r="55"/>
    <!-- Vertical arrow -->
    <line x1="0" y1="60" x2="0" y2="-130"/>
    <!-- Arrow head -->
    <path d="M-20,-110 L0,-145 L20,-110" fill="#2D2D2D"/>
    <!-- Crosshair ticks -->
    <line x1="-45" y1="-20" x2="-65" y2="-20"/>
    <line x1="45" y1="-20" x2="65" y2="-20"/>
    <line x1="0" y1="25" x2="0" y2="45"/>
  </g>
</svg>
